<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Metodologias Scrum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Cabeçalho Scrum -->
        <div class="header-scrum">
            <span>METODOLOGIAS</span>
            <h1>SCRUM</h1>
        </div>

        <!-- Formulário de Cadastro -->
        <div class="signup-card">
            <h2>Crie a sua conta</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>
                </div>
                <div class="form-group">
                    <label for="usuario">Usuário:</label>
                    <input type="text" id="usuario" placeholder="Digite seu usuário" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" placeholder="Digite seu CPF" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn-cadastrar">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Pop-up de Sucesso (Modal) com o Mascote Integrado -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-wrapper">
            <!-- Mascote apontando para o arquivo local -->
            <div class="mascot-container">
                <img src="BorB(sem fundo_corpo).png" alt="Mascote BorB">
            </div>

            <div class="modal-card">
                <h3>Conta criada<br>com sucesso!!</h3>
                <p>Você pode iniciar seus testes de certificação agora!! Caso não queira, poderá realizar em outro momento.</p>
                <div class="modal-buttons">
                    <button class="btn-modal-primary" id="btnIniciar">Iniciar testes</button>
                    <button class="btn-modal-secondary" id="btnFechar">Não agora</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
