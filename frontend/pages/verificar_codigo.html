<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>BorB — Verificar código</title>
  <link rel="stylesheet" href="../css/verificarcodigo.css">
</head>
<body>
  <header class="auth-header">
    <a class="auth-brand" href="index.html" aria-label="BorB — página inicial">
      <span class="auth-brand__icon" aria-hidden="true">B</span>
      <span class="auth-brand__copy">
        <span class="auth-brand__name">BorB</span>
        <span class="auth-brand__version">SCRUM_v0.1</span>
      </span>
    </a>
    <a class="auth-header__link" href="login.html">Entrar</a>
  </header>

  <main class="pagina">
    <section class="card" aria-labelledby="titulo-verificar">
      <h1 class="card__titulo" id="titulo-verificar">Verificar código</h1>

      <!-- O ID do pedido vem do sessionStorage; o código chega por e-mail -->
      <form class="form" id="form-verificar" novalidate>
        <p class="card__descricao">Enviamos um código de seis dígitos para o seu e-mail. Digite-o abaixo para continuar.</p>

        <div class="campo">
          <label class="sr-only" for="codigo">Código de seis dígitos</label>
          <input class="campo__input campo__input--codigo" type="text" id="codigo" name="codigo"
                 inputmode="numeric" pattern="[0-9]*" maxlength="6"
                 placeholder="000000" autocomplete="one-time-code" autocapitalize="off"
                 spellcheck="false" required aria-describedby="codigo-ajuda codigo-erro">
          <small class="campo__ajuda" id="codigo-ajuda">O código vale por 10 minutos e só pode ser usado uma vez.</small>
          <span class="campo__erro" id="codigo-erro" aria-live="polite"></span>
        </div>

        <p class="tempo-codigo" id="tempo-codigo"></p>

        <p class="aviso" id="aviso-verificar" role="status"></p>

        <button class="btn" id="verificar" type="submit">Verificar código</button>
      </form>

      <p class="novo-codigo">
        Não recebeu o código? <a id="novo-codigo" href="recuperar_senha.html">Solicitar novo código</a>
      </p>
    </section>

    <a class="link-secundario" href="login.html">Voltar para o login</a>
  </main>

  <footer class="rodape">
    Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
  </footer>

  <script src="../js/recuperacao-fluxo.js"></script>
  <script src="../js/verificacao.js"></script>
</body>
</html>
