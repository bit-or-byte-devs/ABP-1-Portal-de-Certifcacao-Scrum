<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BorB — Criar conta</title>
  <link rel="stylesheet" href="../css/cadastro.css">
  <link rel="stylesheet" href="../css/notificacao.css">
  <link rel="stylesheet" href="../css/auth-tema.css">
</head>
<body>
  <header class="auth-header">
    <a class="auth-brand" href="index.html" aria-label="BorB — página inicial">
      <span class="auth-brand__icon" aria-hidden="true">B</span>
      <span class="auth-brand__copy">
        <span class="auth-brand__name">BorB</span>
        <span class="auth-brand__version">SCRUM_v0.1</span>
      </span>
    </a>
    <a class="auth-header__link" href="login.html">Entrar</a>
  </header>
  <main class="pagina">



    <section class="card card--largo" aria-labelledby="titulo-cadastro">
      <h1 class="card__titulo" id="titulo-cadastro">Crie a sua conta</h1>

      <form class="form" data-validar data-endpoint="/api/candidatos"
            data-sucesso-titulo="Conta criada!"
            data-sucesso="Seu cadastro foi concluído. Redirecionando para o login..." novalidate>

        <div class="campo campo--linha">
          <label class="campo__rotulo" for="nome">Nome completo:</label>
          <input class="campo__input" type="text" id="nome" name="nome"
                 placeholder="Digite seu nome completo" autocomplete="name"
                 maxlength="120" data-nome-completo required aria-describedby="nome-erro">
          <span class="campo__erro" id="nome-erro" aria-live="polite"></span>
        </div>

        <div class="campo campo--linha">
          <label class="campo__rotulo" for="cpf">CPF:</label>
          <input class="campo__input" type="text" id="cpf" name="cpf"
                 placeholder="000.000.000-00" inputmode="numeric" maxlength="14"
                 autocomplete="username" data-cpf required aria-describedby="cpf-erro">
          <span class="campo__erro" id="cpf-erro" aria-live="polite"></span>
        </div>

        <div class="campo campo--linha">
          <label class="campo__rotulo" for="email">E-mail:</label>
          <input class="campo__input" type="email" id="email" name="email"
                 placeholder="Digite seu e-mail" autocomplete="email"
                 maxlength="160" required aria-describedby="email-erro">
          <span class="campo__erro" id="email-erro" aria-live="polite"></span>
        </div>

        <div class="campo campo--linha">
          <label class="campo__rotulo" for="senha">Senha:</label>
          <div class="campo__caixa campo__caixa--senha">
            <input class="campo__input" type="password" id="senha" name="senha" maxlength="1024"
                   placeholder="Mínimo 8 caracteres" autocomplete="new-password"
                   data-min="8" data-senha-forte required aria-describedby="senha-erro">
            <button class="btn-olho" type="button" aria-controls="senha" aria-pressed="false" aria-label="Mostrar senha">
              <svg class="icone-mostrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icone-ocultar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
          <span class="campo__erro" id="senha-erro" aria-live="polite"></span>
        </div>

        <div class="campo campo--linha">
          <label class="campo__rotulo" for="confirmar-senha">Confirmar senha:</label>
          <div class="campo__caixa campo__caixa--senha">
            <input class="campo__input" type="password" id="confirmar-senha" name="confirmarSenha"
                   placeholder="Repita sua senha" autocomplete="new-password"
                   data-igual="senha" data-nao-enviar required aria-describedby="confirmar-senha-erro">
            <button class="btn-olho" type="button" aria-controls="confirmar-senha" aria-pressed="false" aria-label="Mostrar senha">
              <svg class="icone-mostrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icone-ocultar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
          <span class="campo__erro" id="confirmar-senha-erro" aria-live="polite"></span>
        </div>

        <!-- LGPD (RNF03): aceite registrado em Candidato."Data de aceite dos termos" -->
        <div class="termos-bloco">
          <label class="termos" for="aceite">
            <input type="checkbox" id="aceite" name="aceiteTermos" required
                   data-msg-obrigatorio="É preciso aceitar os termos para criar a conta."
                   aria-describedby="aceite-erro">
            <span>Li e aceito os <a href="#" target="_blank">Termos de Uso</a> e a
              <a href="#" target="_blank">Política de Privacidade</a>, e autorizo o uso
              dos meus dados para emissão do certificado.</span>
          </label>
          <span class="campo__erro" id="aceite-erro" aria-live="polite"></span>
        </div>

        <p class="aviso" role="status"></p>

        <button class="btn" type="submit">Cadastrar</button>
      </form>
    </section>
  </main>

  <footer class="rodape">
    Já tem uma conta? <a href="login.html">Faça Login</a>
  </footer>

  <script src="../js/notificacao.js"></script>
  <script src="../js/form.js"></script>
</body>
</html>
