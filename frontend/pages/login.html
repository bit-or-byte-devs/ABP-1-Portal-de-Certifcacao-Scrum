<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BorB — Entrar</title>
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/auth-tema.css">
</head>
<body>
  <header class="auth-header">
    <a class="auth-brand" href="index.html" aria-label="BorB — página inicial">
      <span class="auth-brand__icon" aria-hidden="true">B</span>
      <span class="auth-brand__copy">
        <span class="auth-brand__name">BorB</span>
        <span class="auth-brand__version">SCRUM_v0.1</span>
      </span>
    </a>
    <a class="auth-header__link" href="cadastro.html">Criar conta</a>
  </header>
  <main class="pagina">




    <section class="card" aria-labelledby="titulo-login">
      <h1 class="card__titulo" id="titulo-login">Entre com sua conta</h1>

      <form class="form" data-validar data-endpoint="/api/auth/login" data-redirecionar="/pages/menu.html" data-preencher-cpf novalidate>
        <div class="campo">
          <label class="sr-only" for="cpf">CPF</label>
          <div class="campo__caixa campo__caixa--icone">
            <svg class="campo__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke-linecap="round"/>
            </svg>
            <input class="campo__input" type="text" id="cpf" name="cpf"
                   placeholder="Digite seu CPF" inputmode="numeric" maxlength="14"
                   autocomplete="username" data-cpf required
                   aria-describedby="cpf-erro">
          </div>
          <span class="campo__erro" id="cpf-erro" aria-live="polite"></span>
        </div>

        <div class="campo">
          <label class="sr-only" for="senha">Senha</label>
          <div class="campo__caixa campo__caixa--icone campo__caixa--senha">
            <svg class="campo__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="4.5" y="10.5" width="15" height="10" rx="2"/>
              <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
            </svg>
            <input class="campo__input" type="password" id="senha" name="senha"
                   placeholder="Digite sua senha" autocomplete="current-password" required
                   aria-describedby="senha-erro">
            <button class="btn-olho" type="button" aria-controls="senha" aria-pressed="false" aria-label="Mostrar senha">
              <svg class="icone-mostrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icone-ocultar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
          <span class="campo__erro" id="senha-erro" aria-live="polite"></span>
        </div>

        <p class="aviso" role="status"></p>

        <button class="btn" type="submit">Avançar</button>
      </form>
    </section>

    <a class="link-secundario" href="../pages/recuperar_senha.html">Esqueci minha senha</a>
  </main>

  <footer class="rodape">
    Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
  </footer>

  <script src="../js/form.js"></script>
</body>
</html>
