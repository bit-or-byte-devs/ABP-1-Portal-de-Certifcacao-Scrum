<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>BorB — Recuperar senha</title>
  <link rel="stylesheet" href="../css/menu-principal.css">
  <link rel="stylesheet" href="../css/recuperarsenha.css">
  <link rel="stylesheet" href="../css/auth-tema.css">
  <link rel="stylesheet" href="../css/navbar-unificada.css">
</head>
<body class="pagina-menu">
  <header class="auth-header">
    <a class="auth-brand" href="index.html" aria-label="BorB — página inicial">
      <span class="auth-brand__icon"><img class="navbar-marca-imagem" src="../../imagens/Borblogo.png" alt="Logo BorB" width="48" height="48"></span>
      <span class="auth-brand__copy">
        <span class="auth-brand__name">BorB</span>
        
      </span>
    </a>
    <a class="auth-header__link" href="login.html">Entrar</a>
  </header>

  <main class="pagina">
    <section class="card" aria-labelledby="titulo-recuperar">
      <h1 class="card__titulo" id="titulo-recuperar">Recuperar senha</h1>

      <form class="form" id="form-solicitar" novalidate>
        <p class="card__descricao">Informe o e-mail cadastrado. Se ele tiver uma conta no portal, você receberá um código de seis dígitos para redefinir sua senha.</p>

        <div class="campo">
          <label class="sr-only" for="email">E-mail cadastrado</label>
          <div class="campo__caixa campo__caixa--icone">
            <svg class="campo__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="M3.5 6.5 12 13l8.5-6.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input class="campo__input" type="email" id="email" name="email"
                   placeholder="Digite seu e-mail" maxlength="254"
                   autocomplete="email" required aria-describedby="email-erro">
          </div>
          <span class="campo__erro" id="email-erro" aria-live="polite"></span>
        </div>

        <p class="aviso" id="aviso-solicitar" role="status"></p>

        <button class="btn" id="solicitar" type="submit">Enviar código</button>
      </form>
    </section>

    <a class="link-secundario" href="login.html">Voltar para o login</a>
  </main>

  <footer class="rodape">
    <p class="rodape-copy"><strong>Bor<span class="marca-b">B</span></strong> &copy; 2026 Equipe Bit or Byte, FATEC Jacareí.</p>
    <nav class="rodape-links" aria-label="Contato e informações legais">
      <a href="mailto:bitorbyte6@gmail.com">bitorbyte6@gmail.com</a>
      <a href="privacidade.html">Privacidade e LGPD</a>
      <a href="termos.html">Termos de Uso</a>
    </nav>
  </footer>

  <script src="../js/ceu-estrelado.js"></script>
  <script src="../js/recuperacao-fluxo.js"></script>
  <script src="../js/recuperacao.js"></script>
</body>
</html>
