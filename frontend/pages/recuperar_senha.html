<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BorB — Recuperar senha</title>
  <link rel="stylesheet" href="../css/recuperarsenha.css">
</head>
<body>
  <header class="auth-header">
    <a class="auth-brand" href="index.html" aria-label="BorB — página inicial">
      <span class="auth-brand__icon" aria-hidden="true">B</span>
      <span class="auth-brand__copy">
        <span class="auth-brand__name">BorB</span>
        <span class="auth-brand__version">SCRUM_v0.1</span>
      </span>
    </a>
    <a class="auth-header__link" href="login.html">Entrar</a>
  </header>

  <main class="pagina">
    <section class="card" aria-labelledby="titulo-recuperar">
      <h1 class="card__titulo" id="titulo-recuperar">Recuperar senha</h1>

      <form class="form" id="form-solicitar" novalidate>
        <p class="card__descricao">Informe o e-mail cadastrado. Se ele tiver uma conta no portal, você receberá um link para redefinir sua senha.</p>

        <div class="campo">
          <label class="sr-only" for="email">E-mail cadastrado</label>
          <div class="campo__caixa campo__caixa--icone">
            <svg class="campo__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="M3.5 6.5 12 13l8.5-6.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input class="campo__input" type="email" id="email" name="email"
                   placeholder="Digite seu e-mail" maxlength="254"
                   autocomplete="email" required aria-describedby="email-erro">
          </div>
          <span class="campo__erro" id="email-erro" aria-live="polite"></span>
        </div>

        <p class="aviso" id="aviso-solicitar" role="status"></p>

        <button class="btn" id="solicitar" type="submit">Enviar link</button>
      </form>
    </section>

    <a class="link-secundario" href="login.html">Voltar para o login</a>
  </main>

  <footer class="rodape">
    Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
  </footer>

  <script src="../js/recuperacao.js"></script>
</body>
</html>
