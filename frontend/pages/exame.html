<head>

                        <input type="radio" name="quiz-option" value="C">
                        <span class="option-letter">C.</span>
                        <span class="option-text">A proibição do uso de linguagens de programação de alto nível.</span>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="quiz-option" value="D">
                        <span class="option-letter">D.</span>
                        <span class="option-text">O excesso de programadores disponíveis no mercado</span>
