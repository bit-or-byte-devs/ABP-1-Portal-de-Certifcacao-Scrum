<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BorB - Exame por tema</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/menu-temas.css">
    <link rel="stylesheet" href="../css/exame.css">
</head>
<body>

    <header class="top-nav">
        <div class="logo-area">
            <div class="logo-icon" aria-hidden="true">B</div>
            <div class="logo-text">
                <p class="logo-nome">BorB</p>
                <small>SCRUM_v8.1</small>
            </div>
        </div>
        <nav class="nav-buttons" aria-label="Conta">
            <a class="btn-nav" href="perfil.html">Perfil</a>
            <button class="btn-nav" type="button" data-logout>Log Out</button>
        </nav>
    </header>

    <main class="main-container exame">
        <div class="top-header-row exame__topo">
            <a href="exames.html" class="btn-voltar">&larr; Voltar</a>
            <h1 id="exame-titulo" class="page-title">Exame por tema</h1>
            <img class="exame__mascote" src="/imagens/BorB(sem fundo_corpo).png" alt="" width="110" height="128">
        </div>

        <!-- Uma questão por tema, sorteada pelo servidor entre as quatro do tema -->
        <article id="questao" class="questao" aria-labelledby="questao-titulo" hidden>
            <header class="questao__cabecalho">
                <h2 id="questao-titulo" class="questao__titulo"></h2>
                <!-- Cronômetro: anuncia só nos marcos (60, 30 e 10 s) pela região abaixo -->
                <p class="cronometro" role="timer" aria-live="off" aria-label="Tempo restante">
                    <time id="cronometro-tempo" datetime="PT150S">2:30</time>
                </p>
                <p id="cronometro-aviso" class="sr-only" aria-live="polite"></p>
            </header>

            <form id="form-questao" class="questao__form">
                <div class="questao__corpo">
                    <figure class="questao__figura">
                        <img id="questao-imagem" src="" alt="">
                    </figure>

                    <!-- As alternativas são montadas pelo exame.js a partir da API -->
                    <fieldset id="alternativas" class="alternativas">
                        <legend class="sr-only">Alternativas</legend>
                    </fieldset>
                </div>

                <!-- Feedback de resposta (RF09/RF11) -->
                <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

                <div class="questao__acoes">
                    <button id="btn-interromper" class="btn-nav" type="button" hidden>Encerrar sessão</button>
                    <button id="btn-confirmar" class="btn-confirmar" type="submit">Confirmar &rarr;</button>
                    <a id="link-continuar" class="btn-confirmar" href="exames.html" hidden>Próximo tema</a>
                </div>
            </form>
        </article>
    </main>

    <footer class="footer-bar">
        <div class="footer-left">
            <span class="footer-brand">BorB</span>
            <span class="footer-copy">&copy; 2026 Scrum Learning Platform. Todos os direitos reservados.</span>
        </div>
        <div class="footer-right">
            <span>STATUS: <span class="green-text">SECURE_MATRIX</span></span>
            <span>FRAMEWORK: <span class="green-text">SCRUM.ORG COMPLIANT</span></span>
        </div>
    </footer>

    <script src="../js/sessao-estudos.js"></script>
    <script src="../js/logout.js"></script>
    <script src="../js/cronometro.js"></script>
    <script src="../js/exame.js"></script>
</body>
</html>
