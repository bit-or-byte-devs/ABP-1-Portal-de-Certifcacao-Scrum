<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu · Metodologias Scrum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/menu.css">
  <script src="../js/menu.js" defer></script>
</head>
<body>
  <main class="pagina">
    <div class="logo" aria-label="Metodologias Scrum">
      <div class="logo__texto"><span class="logo__sub">METODOLOGIAS</span><span class="logo__nome">SCRUM</span></div>
    </div>
    <section class="card" aria-labelledby="boas-vindas">
      <h1 class="card__titulo" id="boas-vindas">Carregando seu menu...</h1>
      <p class="card__descricao">Escolha o que deseja fazer.</p>
      <div class="menu__acoes">
        <button class="btn" type="button" data-em-breve disabled>Área de estudos</button>
        <button class="btn" type="button" data-em-breve disabled>Iniciar certificação</button>
        <button class="btn menu__sair" type="button" id="sair">Sair</button>
      </div>
      <p class="aviso" id="aviso-menu" role="status"></p>
    </section>
  </main>
</body>
</html>
