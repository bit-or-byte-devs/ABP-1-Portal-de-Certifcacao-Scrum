<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BorB - Certificado</title>
    <link rel="stylesheet" href="../css/menu-temas.css">
</head>
<body>

    <header class="top-nav">
        <div class="logo-area">
            <div class="logo-icon">B</div>
            <div class="logo-text">
                <h2>BorB</h2>
                <small>SCRUM_v8.1</small>
            </div>
        </div>
        <div class="nav-buttons">
            <button class="btn-nav">Perfil</button>
            <button class="btn-nav">Log Out</button>
        </div>
    </header>

    <main class="main-container" data-tela="certificado">
        <div class="top-header-row">
            <a href="menu.html" class="btn-voltar">&larr; Voltar</a>
            <h1 class="page-title">Certificado</h1>
        </div>

        <div class="themes-wrapper">
            <div class="theme-card active" data-id="1">
                <div class="theme-main-row">
                    <h3>Scrum BorB Certification</h3>
                    <div class="theme-controls">
                        <div class="progress-badge">Progresso <span class="green-text" data-certificate-progress>0%</span></div>
                        <button class="btn-iniciar" type="button" data-label="Abrir certificado">
                            <svg class="certificate-lock" viewBox="0 0 16 16" aria-hidden="true">
                                <path fill="currentColor" d="M4.5 6V4.5a3.5 3.5 0 0 1 7 0V6h.75A1.75 1.75 0 0 1 14 7.75v6.5A1.75 1.75 0 0 1 12.25 16h-8.5A1.75 1.75 0 0 1 2 14.25v-6.5A1.75 1.75 0 0 1 3.75 6H4.5Zm1.5 0h4V4.5a2 2 0 0 0-4 0V6Zm2 3a1.25 1.25 0 0 0-.75 2.25V13h1.5v-1.75A1.25 1.25 0 0 0 8 9Z"/>
                            </svg>
                            <span>Consultar certificado</span>
                        </button>
                    </div>
                </div>
                <div class="theme-desc">
                    <p>Seu certificado Scrum BorB.</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer-bar">
        <div class="footer-left">
            <span class="footer-brand">BorB</span>
            <span class="footer-copy">&copy; 2026 Scrum Learning Platform. Todos os direitos reservados.</span>
        </div>
        <div class="footer-right">
            <span>STATUS: <span class="green-text">SECURE_MATRIX</span></span>
            <span>FRAMEWORK: <span class="green-text">SCRUM.ORG COMPLIANT</span></span>
        </div>
    </footer>

    <script src="../js/menu-temas.js"></script>
</body>
</html>
