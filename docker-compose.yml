# Sobe o Portal de Certificação (PostgreSQL + preparação + app):
#   cp .env.example .env        (PowerShell: Copy-Item .env.example .env)
#   docker compose up -d --build
# Depois acesse http://localhost:3000/pages/index.html
#
# Os valores do banco e os segredos padrão abaixo servem apenas para demonstração
# e desenvolvimento local. O envio de e-mail (RECUPERACAO_MODO e SMTP_*) vem só do
# .env ao lado deste arquivo; nenhuma credencial fica escrita aqui. Sem essas
# variáveis, o portal sobe normalmente e o log avisa que a recuperação não enviará códigos.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portal_certificacao
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_dev_123
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executados apenas na primeira criação do volume, em ordem alfabética.
      - ./database/ddl/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/dml/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U portal -d portal_certificacao"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Usa a mesma receita de imagem da aplicação e encerra após preparar o banco.
  preparar-banco:
    build: .
    command: ["npm", "run", "db:preparar"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: portal_certificacao
      DB_USER: portal
      DB_PASSWORD: portal_dev_123
    restart: "no"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      preparar-banco:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: portal_certificacao
      DB_USER: portal
      DB_PASSWORD: portal_dev_123
      SESSION_SECRET: ${SESSION_SECRET:-3f9a1c7e5b2d48a6c0e1f7b93d5a2c84e6f10b7a9c3d5e2f48a1b6c7d9e0f123}
      RECUPERACAO_SECRET: ${RECUPERACAO_SECRET:-a7c2e9d4b1f6038c5e7a2d9b4f1c6e83d0a5b7c9e2f4a6d8b1c3e5f70912a4b6}
      # console (só em development): o código aparece em "docker compose logs app".
      # smtp ou vazio: envio real, exige todas as SMTP_* preenchidas no .env.
      RECUPERACAO_MODO: ${RECUPERACAO_MODO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      # Porta do navegador; defina APP_PORT no .env se a 3000 estiver ocupada.
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
